# Tool retrieval text for semantic matching.
# Used by _build_tool_docs_from_schemas() to anchor queries to tools.
# Format: Chinese keywords + English keywords + SPSS Syntax Reference Overview.
# Source: SPSS Statistics 29 Command Syntax Reference (syntaxreference.pdf)

run_acf: "自相关 时间序列 ACF PACF autocorrelation 滞后 相关结构 序列相关 ACF displays and plots the sample autocorrelation function of one or more time series. You can also display and plot the autocorrelations of transformed series by requesting natural log and differencing transformations within the procedure."

run_anova: "方差分析 因子设计 ANOVA factorial 协方差分析 双因素 单因素 多因素 ANOVA performs analysis of variance for factorial designs. The default is the full factorial model if there are five or fewer factors. Analysis of variance tests the hypothesis that the group means of the dependent variable are equal. The dependent variable is interval-level, and one or more categorical variables define the groups. These categorical variables are termed factors. ANOVA also allows you to include continuous explanatory variables, termed covariates. Other procedures that perform analysis of variance are ONEWAY, SUMMARIZE, and GLM. To perform a comparison of two means, use TTEST."

run_crstab: "交叉表 卡方检验 chi-square 列联表 分类变量关联 频数交叉 CROSSTABS produces contingency tables showing the joint distribution of two or more variables that have a limited number of distinct values. The frequency distribution of one variable is subdivided according to the values of one or more variables. The unique combination of values for two or more variables defines a cell. CROSSTABS can operate in two different modes: general and integer. Integer mode builds some tables more efficiently but requires more specifications than general mode. Some subcommand specifications and statistics are available only in integer mode."

run_descriptives: "描述统计 均值 标准差 平均值 概况 总结 descriptive statistics mean 按组计算 By default, MEANS (alias BREAKDOWN) displays means, standard deviations, and group counts for a numeric dependent variable and group counts for a string variable within groups defined by one or more control (independent) variables. Other procedures that display univariate statistics are SUMMARIZE, FREQUENCIES, and DESCRIPTIVES."

run_eda: "探索性分析 异常值 箱线图 EDA examine outlier 正态性检验 EXAMINE provides stem-and-leaf plots, histograms, boxplots, normal plots, robust estimates of location, tests of normality, and other descriptive statistics. Separate analyses can be obtained for subgroups of cases."

run_fit: "误差统计 残差 FIT RMSE MAE 预测评估 拟合误差 forecast accuracy FIT displays a variety of descriptive statistics computed from the residual series as an aid in evaluating the goodness of fit of one or more models."

run_frequencies: "频率分布 频数统计 占比 百分比 frequency distribution 比例 比重 直方图 FREQUENCIES produces tables that show frequency counts and percentages of the values of individual variables. You can also use FREQUENCIES to obtain summary statistics tables for both categorical and continuous variables. ."

run_genlog: "对数线性模型 log-linear 广义线性模型 分类变量建模 genlog GENLOG is a general procedure for model fitting, hypothesis testing, and parameter estimation for any model that has categorical variables as its major components. As such, GENLOG subsumes a variety of related techniques, including general models of multiway contingency tables, logit models, logistic regression on categorical variables, and quasi- independence models. GENLOG, following the regression approach, uses dummy coding to construct a design matrix for estimation and produces maximum likelihood estimates of parameters by means of the Newton-Raphson algorithm. Since the regression approach uses the original parameter spaces, the parameter estimates correspond to the original levels of the categories and are therefore easier to interpret. HILOGLINEAR, which uses an iterative proportional-fitting algorithm, is more efficient for hierarchical models and useful in model building, but it cannot produce parameter estimates for unsaturated models, does not permit specification of contrasts for parameters, and does not display a correlation matrix of the parameter estimates. The General Loglinear Analysis and Logit Loglinear Analysis dialog boxes are both associated with the GENLOG command. In previous releases, these dialog boxes were associated with the LOGLINEAR command. The LOGLINEAR command is now available only as a syntax command. The differences are described in the discussion of the LOGLINEAR command."

run_hiloglinear: "层次对数线性 交互效应 hierarchical log-linear 多维列联表 HILOGLINEAR fits hierarchical loglinear models to multidimensional contingency tables using an iterative proportional-fitting algorithm. HILOGLINEAR also estimates parameters for saturated models. These techniques are described elsewhere in 32, 33, and 34. HILOGLINEAR is much more efficient for these models than the LOGLINEAR procedure because HILOGLINEAR uses an iterative proportional-fitting algorithm rather than the Newton-Raphson method used in LOGLINEAR."

run_kmeans: "聚类 分群 cluster analysis k-means 分组模式 簇 When the desired number of clusters is known, QUICK CLUSTER groups cases efficiently into clusters. It is not as flexible as CLUSTER, but it uses considerably less processing time and memory, especially when the number of cases is large."

run_km: "Kaplan-Meier 生存曲线 生存函数 产品限估计 Kaplan-Meier survival curve event time 风险函数 KM uses the Kaplan-Meier (product-limit) technique to describe and analyze the length of time to the occurrence of an event, often known as survival time. KM is similar to SURVIVAL in that it produces nonparametric estimates of the survival functions. However, instead of dividing the period of time under examination into arbitrary intervals, KM evaluates the survival function at the observed event times. For analysis of survival times with covariates, including time-dependent covariates, see the COXREG command."

run_knn: "K近邻 分类 最近邻 KNN nearest neighbor classification 相似度 距离 邻居 Nearest Neighbor Analysis is a method for classifying cases based on their similarity to other cases. In machine learning, it was developed as a way to recognize patterns of data without requiring an exact match to any stored patterns, or cases. Similar cases are near each other and dissimilar cases are distant from each other. Thus, the distance between two cases is a measure of their dissimilarity. Cases that are near each other are said to be neighbors. When a new case (holdout) is presented, its distance from each of the cases in the model is computed. The classifications of the most similar cases—the nearest neighbors—are tallied and the new case is placed into the category that contains the greatest number of nearest neighbors. You can specify the number of nearest neighbors to examine; this value is called k."

run_mresp: "多重响应 多选题 multiple response 多项选择 问卷 MULT RESPONSE displays frequencies and optional percentages for multiple-response items in univariate tables and multivariate crosstabulations. Another procedure that analyzes multiple-response items is TABLES, which has most, but not all, of the capabilities of MULT RESPONSE. TABLES has special formatting capabilities that make it useful for presentations. Multiple-response items are questions that can have more than one value for each case. For example, the respondent may have been asked to circle all magazines read within the last month in a list of magazines. You can organize multiple-response data in one of two ways for use in the program. For each possible response, you can create a variable that can have one of two values, such as 1 for no and 2 for yes; this is the multiple-dichotomy method. Alternatively, you can estimate the maximum number of possible answers from a respondent and create that number of variables, each of which can have a value representing one of the possible answers, such as 1 for Time, 2 for Newsweek, and 3 for PC Week. If an individual did not give the maximum number of answers, the extra variables receive a missing-value code. This is the multiple-response or multiple-category method of coding answers. To analyze the data entered by either method, you combine variables into groups. The technique depends on whether you have defined multiple-dichotomy or multiple-response variables. When you create a multiple-dichotomy group, each component variable with at least one yes value across cases becomes a category of the group variable. When you create a multiple-response group, each value becomes a category and the program calculates the frequency for a particular value by adding the frequencies of all component variables with that value. Both multiple-dichotomy and multiple-response groups can be crosstabulated with other variables in MULT RESPONSE."

run_market: "正交设计 联合分析 市场研究 orthoplan conjoint 产品设计 因子设计 消费者偏好 ORTHOPLAN generates an orthogonal main-effects plan for a full-concept conjoint analysis. ORTHOPLAN can append or replace an existing active dataset, or it can build an active dataset (if one does not already exist). The generated plan can be listed in full-concept profile, or card, format using PLANCARDS. The file that is created by ORTHOPLAN can be used as the plan file for CONJOINT."

run_mva: "缺失值分析 缺失数据 插补 missing value analysis imputation EM估计 MVA describes the missing value patterns in a data file (data matrix). It can estimate the means, the covariance matrix, and the correlation matrix by using listwise, pairwise, regression, and EM estimation methods. Missing values themselves can be estimated (imputed), and you can then save the new data file."

run_nptest: "非参数检验 Mann-Whitney Wilcoxon Kruskal-Wallis 秩检验 nonparametric NPTESTS is a collection of nonparametric tests. These tests make minimal assumptions about the underlying distribution of the data. The tests that are available in NPTESTS can be grouped into three broad categories based on how the data are organized. • A one-sample test analyzes one field. • A test for related samples compares two or more fields for the same set of cases. • An independent-samples test analyzes one field that is grouped by categories of another field."

run_oneway: "单因素方差分析 多组比较 one-way ANOVA 事后检验 F检验 三组以上均值 ONEWAY produces a one-way analysis of variance for an interval-level dependent variable by one numeric independent variable that defines the groups for the analysis. Other procedures that perform an analysis of variance are SUMMARIZE, UNIANOVA, and GLM (GLM is available in SPSS® Statistics Standard Edition or the Advanced Statistics Option). Some tests not included in the other procedures are available as options in ONEWAY."

run_rank: "排名 秩 百分位 rank transform 排序 等级 RANK produces new variables containing ranks, normal scores, and Savage and related scores for numeric variables."

run_ratios: "比率分析 比值 ratio statistics 分子 分母 比例 均值比 RATIO STATISTICS provides a variety of descriptive statistics for the ratio between two variables."

run_regression: "回归 线性回归 预测 影响因素 回归分析 regression linear 自变量 因变量 R方 建模 REGRESSION calculates multiple regression equations and associated statistics and plots. REGRESSION also calculates collinearity diagnostics, predicted values, residuals, measures of fit and influence, and several statistics based on these measures."

run_sur: "生存分析 生命表 survival Kaplan-Meier 风险 存活率 死亡率 SURVIVAL produces actuarial life tables, plots, and related statistics for examining the length of time to the occurrence of an event, often known as survival time. Cases can be classified into groups for separate analyses and comparisons. Time intervals can be calculated with the BONC® SPSS® Statistics date- and time-conversion functions —for example, CTIME.DAYS or YRMODA. For a closely related alternative nonparametric analysis of survival times using the product-limit Kaplan-Meier estimator, see the KM command. For an analysis of survival times with covariates, including time-dependent covariates, see the COXREG command."

run_tsplot: "时间序列变换 差分 tsplot 序列预处理 平稳化 平稳化处理 TSPLOT produces a plot of one or more time series or sequence variables. You can request natural log and differencing transformations to produce plots of transformed variables. Several plot formats are available."

run_ttest: "t检验 两组均值比较 配对样本 单样本t检验 independent paired 前后测 均值比较 T-TEST compares sample means by calculating Student’s t and displays the two-tailed probability of the difference between the means. Statistics are available for one-sample (tested against a specified value), independent samples (different groups of cases), or paired samples (different variables). Other procedures that compare group means are ANOVA, ONEWAY, UNIANOVA, and GLM, (GLM is available in SPSS® Statistics Standard Edition or the Advanced Statistics Option)."

run_unianova: "多因素方差分析 ANCOVA 协方差分析 交互效应 two-way ANOVA GLM 两个因素 This section describes the use of UNIANOVA for univariate analyses. The UNIANOVA procedure provides regression analysis and analysis of variance for one dependent variable by one or more factors and/or variables."

run_wls: "加权回归 异方差 weighted least squares WLS 权重 最优幂 WLS (weighted least squares) estimates regression models with different weights for different cases. Weighted least squares should be used when errors from an ordinary regression are heteroscedastic—that is, when the size of the residual is a function of the magnitude of some variable, termed the source. The WLS model is a simple regression model in which the residual variance is a function of the source variable, up to some power transform indicated by a delta value. For fuller regression results, save the weights produced by WLS and specify that weight variable on the REGWGT subcommand in REGRESSION."
